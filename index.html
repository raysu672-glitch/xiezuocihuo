<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基础必背20词伙 - 选词练习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #0a0e17;
    color: #e0e0e0;
    min-height: 100vh;
    overflow: hidden;
    transition: background 1s;
  }

  body.fever {
    background: #0a0e17;
    animation: feverBg 3s linear infinite;
  }
  @keyframes feverBg {
    0%   { background: #0a0e17; }
    25%  { background: #1a0020; }
    50%  { background: #0a0e17; }
    75%  { background: #001a2e; }
    100% { background: #0a0e17; }
  }
  body.fever::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,0,128,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(0,200,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 0%,   rgba(255,215,0,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
    animation: feverGlow 2s ease-in-out infinite alternate;
  }
  @keyframes feverGlow {
    0%   { opacity: 0.6; }
    100% { opacity: 1; }
  }
  body.fever::after {
    content: '';
    position: fixed;
    top: 0; left: -100%; width: 300%; height: 100%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,0,128,0.06) 20%,
      rgba(0,200,255,0.06) 40%,
      rgba(255,215,0,0.06) 60%,
      rgba(188,140,255,0.06) 80%,
      transparent 100%);
    pointer-events: none;
    z-index: 0;
    animation: feverSweep 4s linear infinite;
  }
  @keyframes feverSweep {
    0%   { left: -300%; }
    100% { left: 0%; }
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 28px;
    background: linear-gradient(135deg, #0d1117, #161b22);
    border-bottom: 1px solid #21262d;
    position: relative;
    z-index: 10;
  }
  .header h1 { font-size: 17px; color: #58a6ff; }
  .header .stats { display: flex; gap: 18px; font-size: 13px; color: #8b949e; }
  .header .stats span b { color: #f0f6fc; }
  .fever-banner {
    display: none;
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 40px rgba(255,0,128,0.5);
    animation: feverBannerPulse 0.8s infinite alternate;
    pointer-events: none;
  }
  body.fever .fever-banner { display: block; }
  @keyframes feverBannerPulse {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 0.8; }
    100% { transform: translate(-50%,-50%) scale(1.05); opacity: 1; }
  }

  .main {
    display: flex;
    height: calc(100vh - 52px);
    position: relative;
    z-index: 5;
  }

  .left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    position: relative;
    overflow: hidden;
  }
  .question-box { text-align: center; z-index: 2; }
  .question-num {
    font-size: 12px;
    color: #58a6ff;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .question-chinese {
    font-size: 30px;
    font-weight: 700;
    color: #f0f6fc;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .question-hint {
    font-size: 13px;
    color: #8b949e;
    margin-top: 14px;
  }
  .fever-timer {
    font-size: 48px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255,215,0,0.7);
    margin-top: 16px;
  }
  .fever-timer.urgent {
    color: #f85149;
    text-shadow: 0 0 30px rgba(248,81,73,0.8);
    animation: timerPulse 0.5s infinite alternate;
  }
  @keyframes timerPulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.15); }
  }

  .center-panel {
    flex: 1.2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 20px;
    position: relative;
  }

  .answer-slots {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    min-height: 52px;
    padding: 12px 20px;
    border-radius: 12px;
    background: rgba(88,166,255,0.05);
    border: 2px dashed rgba(88,166,255,0.2);
    min-width: 280px;
    max-width: 600px;
    transition: border-color 0.3s;
  }
  .answer-slots.fever-highlight {
    border-color: rgba(255,215,0,0.5);
    background: rgba(255,215,0,0.03);
  }
  .slot {
    padding: 8px 16px;
    border-radius: 8px;
    background: #161b22;
    border: 1px solid #30363d;
    color: #8b949e;
    font-size: 16px;
    min-width: 60px;
    text-align: center;
    transition: all 0.3s;
  }
  .slot.filled {
    background: #1f2937;
    border-color: #58a6ff;
    color: #f0f6fc;
  }

  .word-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 650px;
  }
  .word-btn {
    padding: 10px 20px;
    border-radius: 10px;
    border: 2px solid #30363d;
    background: #161b22;
    color: #e0e0e0;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    position: relative;
  }
  .word-btn:hover:not(.fogged):not(.selected) {
    border-color: #58a6ff;
    background: #1c2333;
    transform: translateY(-2px);
  }
  .word-btn:active:not(.fogged) { transform: scale(0.95); }
  .word-btn.selected {
    border-color: #238636;
    background: rgba(35,134,54,0.2);
    color: #3fb950;
  }
  .word-btn.wrong-flash {
    animation: wrongShake 0.5s;
    border-color: #f85149 !important;
    background: rgba(248,81,73,0.2) !important;
    color: #f85149 !important;
  }

  /* 迷雾模式 */
  .word-btn.fogged {
    border-color: rgba(88,166,255,0.3);
    background: rgba(88,166,255,0.05);
    color: transparent;
    cursor: pointer;
    position: relative;
  }
  .word-btn.fogged::after {
    content: '?';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(88,166,255,0.5);
    font-size: 18px;
    font-weight: 700;
  }
  .word-btn.fogged .fog-text {
    color: #58a6ff;
    font-family: monospace;
    letter-spacing: 2px;
  }
  .word-btn.fogged:hover {
    border-color: #58a6ff;
    background: rgba(88,166,255,0.1);
    transform: translateY(-2px);
  }
  .word-btn.fog-cleared {
    border-color: #3fb950;
    background: rgba(63,185,80,0.1);
    color: #3fb950;
  }

  /* Fever 打字区 */
  .fever-type-area {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 600px;
  }
  body.fever .fever-type-area { display: flex; }
  body.fever .word-pool,
  body.fever .answer-slots,
  body.fever .action-btns { display: none !important; }

  .fever-input {
    width: 100%;
    padding: 16px 24px;
    border-radius: 14px;
    border: 2px solid rgba(255,215,0,0.4);
    background: rgba(255,215,0,0.03);
    color: #ffd700;
    font-size: 24px;
    font-weight: 600;
    text-align: center;
    outline: none;
    letter-spacing: 2px;
    transition: border-color 0.2s;
  }
  .fever-input:focus {
    border-color: rgba(255,215,0,0.8);
    box-shadow: 0 0 30px rgba(255,215,0,0.15);
  }
  .fever-input::placeholder {
    color: rgba(255,215,0,0.25);
    font-size: 18px;
    letter-spacing: 1px;
  }
  .fever-progress {
    font-size: 13px;
    color: rgba(255,215,0,0.5);
    letter-spacing: 1px;
  }

  .action-btns {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }
  .btn-check, .btn-clear {
    padding: 10px 32px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-check {
    background: linear-gradient(135deg, #238636, #2ea043);
    color: white;
  }
  .btn-check:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(46,160,67,0.4); }
  .btn-clear {
    background: #21262d;
    color: #8b949e;
    border: 1px solid #30363d;
  }
  .btn-clear:hover { background: #30363d; }

  /* 迷雾弹窗 */
  .fog-modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.3s;
  }
  .fog-modal {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    min-width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .fog-modal h3 {
    font-size: 15px;
    color: #8b949e;
    margin-bottom: 12px;
    font-weight: 400;
  }
  .fog-modal .fog-word-display {
    font-size: 28px;
    font-family: monospace;
    color: #58a6ff;
    letter-spacing: 4px;
    margin-bottom: 18px;
    min-height: 40px;
  }
  .fog-modal .fog-input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid #30363d;
    background: #0d1117;
    color: #f0f6fc;
    font-size: 18px;
    text-align: center;
    outline: none;
    letter-spacing: 2px;
  }
  .fog-modal .fog-input:focus { border-color: #58a6ff; }
  .fog-modal .fog-hint {
    font-size: 12px;
    color: #484f58;
    margin-top: 8px;
  }
  .fog-modal .fog-btns {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    justify-content: center;
  }
  .fog-modal .fog-btn {
    padding: 8px 24px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .fog-btn-confirm {
    background: linear-gradient(135deg, #238636, #2ea043);
    color: white;
  }
  .fog-btn-cancel {
    background: #21262d;
    color: #8b949e;
    border: 1px solid #30363d;
  }
  .fog-result {
    font-size: 14px;
    margin-top: 10px;
    min-height: 20px;
  }
  .fog-result.success { color: #3fb950; }
  .fog-result.fail { color: #f85149; }

  /* 右：能量槽 */
  .right-panel {
    width: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 10px;
    background: #0d1117;
    border-left: 1px solid #21262d;
    gap: 14px;
    position: relative;
    z-index: 10;
    transition: background 0.5s;
  }
  body.fever .right-panel {
    background: rgba(255,215,0,0.03);
    border-left-color: rgba(255,215,0,0.2);
  }

  .energy-label {
    font-size: 12px;
    color: #8b949e;
    letter-spacing: 1px;
  }
  .energy-value {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, #58a6ff, #bc8cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: all 0.3s;
  }
  body.fever .energy-value {
    background: linear-gradient(135deg, #ffd700, #ff6b35);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: energyPulse 0.6s infinite alternate;
  }
  @keyframes energyPulse {
    0% { transform: scale(1); filter: brightness(1); }
    100% { transform: scale(1.08); filter: brightness(1.3); }
  }

  .combo-label { font-size: 11px; color: #8b949e; }
  .combo-value {
    font-size: 20px;
    font-weight: 700;
    color: #f0f6fc;
  }
  .combo-value.hot {
    color: #ff6b35;
    animation: comboPulse 0.5s infinite alternate;
  }
  body.fever .combo-value { color: #ffd700; }

  .energy-bar-outer {
    width: 36px;
    height: 240px;
    background: #161b22;
    border-radius: 18px;
    border: 2px solid #21262d;
    position: relative;
    overflow: hidden;
    transition: border-color 0.5s;
  }
  body.fever .energy-bar-outer {
    border-color: rgba(255,215,0,0.3);
  }
  .energy-bar-inner {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 0%;
    border-radius: 0 0 16px 16px;
    transition: height 0.5s ease, background 0.5s, box-shadow 0.5s;
    background: linear-gradient(to top, #238636, #3fb950);
  }
  .energy-bar-inner.mid {
    background: linear-gradient(to top, #d29922, #f0c674);
  }
  .energy-bar-inner.high {
    background: linear-gradient(to top, #bc8cff, #f778ba);
  }
  .energy-bar-inner.max {
    background: linear-gradient(to top, #ff6b35, #ffd700);
    animation: maxGlow 1s infinite alternate;
  }
  body.fever .energy-bar-inner {
    background: linear-gradient(to top, #ffd700, #ff6b35) !important;
    animation: feverBarGlow 0.8s infinite alternate !important;
  }
  @keyframes feverBarGlow {
    0% { box-shadow: inset 0 0 15px rgba(255,215,0,0.3); }
    100% { box-shadow: inset 0 0 35px rgba(255,215,0,0.7); }
  }
  @keyframes maxGlow {
    0% { box-shadow: inset 0 0 20px rgba(255,215,0,0.4); }
    100% { box-shadow: inset 0 0 40px rgba(255,215,0,0.8); }
  }

  .energy-emojis {
    font-size: 20px;
    text-align: center;
    min-height: 28px;
    transition: all 0.3s;
  }
  body.fever .energy-emojis { font-size: 24px; }

  /* 特效 */
  .correct-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 100;
  }
  .correct-text {
    font-size: 64px;
    font-weight: 900;
    color: #3fb950;
    text-shadow: 0 0 40px rgba(63,185,80,0.6);
    animation: correctPop 0.8s ease-out forwards;
  }
  .correct-text.combo-2 { color: #58a6ff; text-shadow: 0 0 40px rgba(88,166,255,0.6); font-size: 72px; }
  .correct-text.combo-3 { color: #bc8cff; text-shadow: 0 0 40px rgba(188,140,255,0.6); font-size: 80px; }
  .correct-text.combo-4 { color: #f778ba; text-shadow: 0 0 60px rgba(247,120,186,0.8); font-size: 88px; }
  .correct-text.combo-5 { color: #ffd700; text-shadow: 0 0 80px rgba(255,215,0,0.9); font-size: 96px; }

  .fever-correct-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 100;
  }
  .fever-correct-text {
    font-size: 80px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 0 60px rgba(255,215,0,0.9), 0 0 120px rgba(255,0,128,0.5);
    animation: feverCorrectPop 0.6s ease-out forwards;
  }
  @keyframes feverCorrectPop {
    0% { transform: scale(0.3) rotate(-5deg); opacity: 0; }
    50% { transform: scale(1.3) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 0; }
  }

  .particle {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99;
    animation: particleFly 1s ease-out forwards;
  }
  .fever-particle {
    position: fixed;
    pointer-events: none;
    z-index: 99;
    font-size: 14px;
    font-weight: 700;
    animation: feverParticleFly 0.7s ease-out forwards;
  }
  @keyframes feverParticleFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
  }
  .firework {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99;
  }

  .flash-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 98;
    animation: flashFade 0.6s ease-out forwards;
  }
  .fever-flash {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 98;
    animation: feverFlashFade 0.3s ease-out forwards;
  }
  @keyframes feverFlashFade {
    0% { opacity: 0.6; }
    100% { opacity: 0; }
  }

  .shake { animation: wrongShake 0.5s; }
  .fever-shake {
    animation: feverShake 0.15s ease-in-out 3;
  }
  @keyframes feverShake {
    0% { transform: translate(0,0); }
    25% { transform: translate(-3px, 1px); }
    50% { transform: translate(2px, -2px); }
    75% { transform: translate(-1px, 2px); }
    100% { transform: translate(0,0); }
  }

  .finish-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    animation: fadeIn 0.5s;
  }
  .finish-overlay h2 { font-size: 44px; color: #ffd700; margin-bottom: 14px; }
  .finish-overlay p { font-size: 19px; color: #8b949e; margin-bottom: 8px; }
  .finish-overlay .btn-restart {
    margin-top: 24px;
    padding: 12px 40px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #58a6ff, #bc8cff);
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .finish-overlay .btn-restart:hover { transform: scale(1.05); }

  @keyframes correctPop {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }
  @keyframes particleFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
  @keyframes flashFade {
    0% { opacity: 0.4; }
    100% { opacity: 0; }
  }
  @keyframes comboPulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.15); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .bg-particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: rgba(88,166,255,0.3);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body.fever .bg-particle { background: rgba(255,215,0,0.3); }

  /* 学习页面 */
  #studyOverlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: #0a0e17;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    z-index: 500; padding: 30px 20px; box-sizing: border-box; overflow-y: auto;
  }
  .study-header { text-align: center; margin-bottom: 16px; padding-top: 10px; }
  .study-header h2 { color: #58a6ff; font-size: 22px; margin-bottom: 6px; }
  .study-header p { color: #8b949e; font-size: 13px; }
  #studyTimer {
    font-size: 48px; font-weight: 900; color: #ffd700;
    margin-bottom: 12px; font-family: 'Courier New', monospace;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
  }
  #studySkipBtn {
    padding: 10px 36px; border-radius: 10px; border: 1px solid #30363d;
    background: #21262d; color: #8b949e; font-size: 15px; cursor: pointer;
    transition: all 0.2s; margin-bottom: 24px;
  }
  #studySkipBtn:hover { background: #30363d; color: #e0e0e0; }
  #studyGrid {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    max-width: 950px;
  }
  .study-card {
    background: #161b22; border: 1px solid #21262d; border-radius: 12px;
    padding: 14px 18px; width: 280px;
    transition: all 0.2s;
  }
  .study-card:hover { border-color: #58a6ff; transform: translateY(-2px); box-shadow: 0 4px 20px rgba(88,166,255,0.15); }
  .study-card-zh { font-size: 15px; color: #f0f6fc; margin-bottom: 6px; font-weight: 600; }
  .study-card-en { font-size: 14px; color: #8b949e; font-family: 'Segoe UI', sans-serif; }
  .study-timer-warning { color: #f85149 !important; animation: studyTimerPulse 0.5s infinite alternate; }
  @keyframes studyTimerPulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }

  /* ── 语义连线弹窗 ── */
  .synthesis-overlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.82);
    display: flex; align-items: center; justify-content: center;
    z-index: 300;
    animation: fadeIn 0.35s;
  }
  .synthesis-modal {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 20px;
    padding: 32px 36px 28px;
    max-width: 640px; width: 90%;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    text-align: center;
    position: relative;
  }
  .synthesis-badge {
    display: inline-block;
    background: linear-gradient(135deg, #58a6ff, #bc8cff);
    color: white; font-size: 11px; font-weight: 700;
    letter-spacing: 2px; padding: 4px 12px;
    border-radius: 20px; margin-bottom: 14px;
  }
  .synthesis-title {
    font-size: 13px; color: #8b949e;
    margin-bottom: 10px;
  }
  .synthesis-plain-sentence {
    background: rgba(248,81,73,0.08);
    border: 1px solid rgba(248,81,73,0.25);
    border-radius: 10px; padding: 12px 18px;
    font-size: 17px; color: #f0f6fc;
    margin-bottom: 20px; line-height: 1.6;
    font-style: italic;
  }
  .synthesis-plain-sentence .plain-label {
    font-size: 11px; color: #f85149; font-style: normal;
    font-weight: 600; letter-spacing: 1px; display: block;
    margin-bottom: 4px;
  }
  .synthesis-instruction {
    font-size: 13px; color: #8b949e; margin-bottom: 16px;
  }
  .synthesis-phrase-btns {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-bottom: 20px;
  }
  .synthesis-phrase-btn {
    padding: 9px 18px; border-radius: 10px;
    border: 2px solid #30363d;
    background: #0d1117; color: #58a6ff;
    font-size: 14px; cursor: pointer;
    transition: all 0.2s; font-family: 'Segoe UI', sans-serif;
    font-weight: 600;
  }
  .synthesis-phrase-btn:hover:not(.used):not(.disabled) {
    border-color: #58a6ff;
    background: rgba(88,166,255,0.08);
    transform: translateY(-2px);
  }
  .synthesis-phrase-btn.used {
    border-color: #238636;
    background: rgba(35,134,54,0.15);
    color: #3fb950; cursor: default;
    text-decoration: line-through;
    opacity: 0.6;
  }
  .synthesis-phrase-btn.wrong-pick {
    animation: wrongShake 0.4s;
    border-color: #f85149 !important;
    background: rgba(248,81,73,0.12) !important;
    color: #f85149 !important;
  }
  .synthesis-target-area {
    background: rgba(88,166,255,0.04);
    border: 2px dashed rgba(88,166,255,0.2);
    border-radius: 12px; padding: 14px 18px;
    font-size: 17px; color: #8b949e;
    line-height: 1.8; min-height: 60px;
    margin-bottom: 20px; transition: border-color 0.3s;
  }
  .synthesis-target-area .syn-blank {
    display: inline-block;
    border-bottom: 2px dashed rgba(88,166,255,0.5);
    min-width: 100px; height: 22px;
    vertical-align: middle; margin: 0 4px;
    transition: all 0.3s;
  }
  .synthesis-target-area .syn-blank.filled {
    border-bottom: none;
    color: #58a6ff; font-weight: 700;
    background: rgba(88,166,255,0.1);
    border-radius: 4px; padding: 0 6px;
  }
  .synthesis-target-area.completed {
    border-color: rgba(63,185,80,0.5);
    background: rgba(63,185,80,0.04);
  }
  .synthesis-target-area.completed .syn-blank.filled {
    color: #3fb950;
    background: rgba(63,185,80,0.1);
  }
  .synthesis-result-msg {
    font-size: 15px; min-height: 24px; margin-bottom: 16px;
    font-weight: 600;
  }
  .synthesis-result-msg.success { color: #3fb950; }
  .synthesis-result-msg.hint    { color: #f85149; }
  .synthesis-skip-btn {
    padding: 8px 28px; border-radius: 8px;
    border: 1px solid #30363d; background: transparent;
    color: #484f58; font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  .synthesis-skip-btn:hover { color: #8b949e; border-color: #484f58; }
</style>
</head>
<body>

<!-- 学习页面 -->
<div id="studyOverlay">
  <div class="study-header">
    <h2>📖 课前学习 — 基础必背20词伙</h2>
    <p>建议先学习 5 分钟，或点击「跳过」直接进入练习</p>
  </div>
  <div id="studyTimer">05:00</div>
  <button id="studySkipBtn">跳过 → 直接练习</button>
  <div id="studyGrid"></div>
</div>

<!-- 游戏内容（默认隐藏） -->
<div id="gameContent" style="display:none;">

<div class="header">
  <h1>词伙练习</h1>
  <div class="fever-banner">FEVER MODE</div>
  <div class="stats">
    <span>进度 <b id="progress">0/20</b></span>
    <span>正确 <b id="correctCount">0</b></span>
    <span>正确率 <b id="accuracy">0%</b></span>
  </div>
</div>

<div class="main">
  <div class="left-panel" id="leftPanel">
    <div class="question-box" id="questionBox">
      <div class="question-num" id="questionNum">01 / 20</div>
      <div class="question-chinese" id="questionChinese">正在加载...</div>
      <div class="question-hint" id="questionHint">点击英文单词组成答案</div>
    </div>
  </div>

  <div class="center-panel" id="centerPanel">
    <div class="answer-slots" id="answerSlots"></div>
    <div class="word-pool" id="wordPool"></div>
    <div class="action-btns">
      <button class="btn-clear" onclick="clearSelection()">清空</button>
      <button class="btn-check" onclick="checkAnswer()">确认</button>
    </div>
    <div class="fever-type-area" id="feverTypeArea">
      <input type="text" class="fever-input" id="feverInput"
             placeholder="直接输入英文答案，按 Enter 确认..."
             autocomplete="off" spellcheck="false">
      <div class="fever-progress" id="feverProgress"></div>
    </div>
  </div>

  <div class="right-panel">
    <div class="energy-label">能量</div>
    <div class="energy-value" id="energyValue">0</div>
    <div class="energy-bar-outer">
      <div class="energy-bar-inner" id="energyBar"></div>
    </div>
    <div class="energy-emojis" id="energyEmojis"></div>
    <div class="combo-label">连击</div>
    <div class="combo-value" id="comboValue">x0</div>
  </div>
</div>
</div>

<script>
window.addEventListener('error', function(e) {
  var msg = 'JS Error: ' + (e.message||'unknown') + ' at ' + (e.filename||'') + ':' + (e.lineno||'');
  var d = document.createElement('div');
  d.style.cssText = 'background:#f85149;color:white;padding:12px 20px;position:fixed;top:0;left:0;right:0;z-index:99999;font-size:14px;';
  d.textContent = msg;
  document.body.appendChild(d);
  console.log(msg);
});
</script>
<script src="game.js"></script>
</body>
</html>
