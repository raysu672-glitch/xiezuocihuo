<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作词伙选词练习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #0a0e17;
    color: #e0e0e0;
    min-height: 100vh;
    overflow: hidden;
    transition: background 1s;
  }

  .btn-back-cat {
    padding: 5px 14px;
    border-radius: 8px;
    border: 1px solid #30363d;
    background: transparent;
    color: #8b949e;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn-back-cat:hover { border-color: #58a6ff; color: #58a6ff; }

  /* ── 页面容器 ── */
  #categoryPage {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    height: 100vh;
    overflow-y: auto;
  }
  #categoryPage::-webkit-scrollbar { width: 6px; }
  #categoryPage::-webkit-scrollbar-track { background: transparent; }
  #categoryPage::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

  .page-header {
    text-align: center;
    padding: 18px 0 14px;
    position: sticky;
    top: 0;
    background: linear-gradient(to bottom, #0a0e17 80%, transparent);
    width: 100%;
    z-index: 10;
  }
  .page-header h1 {
    font-size: 22px;
    color: #c9d1d9;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .page-header p {
    font-size: 13px;
    color: #8b949e;
    margin-top: 5px;
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #484f58;
    margin: 16px 0 10px;
    align-self: flex-start;
    padding-left: 4px;
  }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    width: 100%;
    max-width: 480px;
  }

  .cat-card {
    background: rgba(22, 27, 34, 0.85);
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.4s forwards;
  }
  .cat-card:hover {
    border-color: #388bfd;
    background: rgba(56, 139, 253, 0.08);
    transform: translateY(-2px);
  }
  .cat-card:active { transform: translateY(0); }
  .cat-card-icon { font-size: 26px; margin-right: 12px; }
  .cat-card-info { flex: 1; }
  .cat-card-name { font-size: 14px; font-weight: 600; color: #c9d1d9; }
  .cat-card-count { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .cat-card-arrow { font-size: 18px; color: #484f58; }

  /* ── 学习页 ── */
  #studyOverlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: #0a0e17;
    display: none; flex-direction: column; align-items: center;
    z-index: 500; padding: 0 20px 30px; box-sizing: border-box; overflow-y: auto;
  }
  .study-header { text-align: center; margin-bottom: 16px; padding-top: 10px; }
  .study-header h2 { color: #58a6ff; font-size: 22px; margin-bottom: 6px; }
  .study-header p { color: #8b949e; font-size: 13px; }
  #studyProgress {
    font-size: 13px; color: #8b949e; margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }

  #studyGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
    width: 100%; max-width: 600px;
    margin-bottom: 16px;
  }
  .study-card {
    background: rgba(22,27,34,0.8); border: 1px solid #30363d;
    border-radius: 10px; padding: 10px; cursor: pointer;
    transition: all 0.15s; opacity: 0.75;
  }
  .study-card:hover { border-color: #388bfd; opacity: 1; }
  .study-card-done { border-color: #3fb950 !important; opacity: 0.5; background: rgba(63,185,80,0.1); }
  .study-card-zh { font-size: 13px; color: #c9d1d9; margin-bottom: 4px; }
  .study-card-en { font-size: 11px; color: #8b949e; }

  #studyCard {
    background: rgba(22,27,34,0.95);
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%; max-width: 520px;
    display: none; flex-direction: column; align-items: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    margin-bottom: 16px;
  }
  #studyCard.active { display: flex; animation: fadeIn 0.3s; }
  .study-learn-zh { font-size: 20px; color: #c9d1d9; margin-bottom: 8px; font-weight: 600; }
  .study-learn-ref {
    font-size: 15px; color: #8b949e; margin-bottom: 20px;
    padding: 8px 14px; background: rgba(22,27,34,0.8);
    border-radius: 8px; letter-spacing: 0.5px;
  }
  .study-learn-round { font-size: 12px; color: #58a6ff; margin-bottom: 10px; }
  .study-learn-round.round2 { color: #3fb950; }
  .study-learn-input {
    width: 100%; padding: 14px 18px; border-radius: 12px;
    border: 1.5px solid #30363d; background: rgba(22,27,34,0.9);
    color: #e0e0e0; font-size: 15px; text-align: center; outline: none;
    transition: border-color 0.2s;
  }
  .study-learn-input:focus { border-color: #58a6ff; }
  .study-learn-input.correct { border-color: #3fb950 !important; background: rgba(63,185,80,0.15) !important; }
  .study-learn-input.wrong { border-color: #f85149 !important; background: rgba(248,81,73,0.1) !important; animation: shake 0.3s; }
  .study-hint { font-size: 13px; color: #8b949e; margin-top: 10px; min-height: 20px; }
  #studyFeedback { font-size: 14px; margin-top: 12px; min-height: 22px; }
  .study-btns { display: flex; gap: 10px; margin-top: 14px; }
  .study-btn {
    padding: 8px 20px; border-radius: 10px;
    border: 1px solid #30363d; background: transparent;
    color: #8b949e; font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  .study-btn:hover { border-color: #388bfd; color: #58a6ff; }
  .study-btn-primary {
    background: rgba(56,139,253,0.2); border-color: #388bfd; color: #58a6ff;
  }
  .study-btn-primary:hover { background: rgba(56,139,253,0.3); }

  /* ── 游戏主体 ── */
  #gameContent {
    display: none;
    height: 100vh;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* 顶部栏 */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px 6px;
    background: rgba(10,14,23,0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(48,54,61,0.6);
    flex-shrink: 0;
    position: relative; z-index: 20;
  }
  .top-left { display: flex; flex-direction: column; gap: 3px; }
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  #headerCatBadge {
    font-size: 11px; color: #58a6ff; font-weight: 600;
    background: rgba(56,139,253,0.1); border: 1px solid rgba(56,139,253,0.3);
    padding: 2px 8px; border-radius: 20px;
  }
  #questionNum { font-size: 12px; color: #8b949e; }
  #progress { font-size: 11px; color: #484f58; }
  .energy-wrap {
    display: flex; flex-direction: column; align-items: center;
    position: relative; width: 32px; height: 80px;
  }
  #energyBar {
    width: 14px; height: 0%; background: #484f58;
    border-radius: 7px; transition: height 0.4s ease, background 0.4s;
    position: absolute; bottom: 0; border: 1px solid rgba(255,255,255,0.1);
  }
  #energyBar.mid { background: linear-gradient(to top, #f0883e, #ffa657); }
  #energyBar.high { background: linear-gradient(to top, #f0883e, #ffd700); }
  #energyBar.max  { background: linear-gradient(to top, #ff6b35, #ffd700, #ff0080); }
  #energyValue { font-size: 10px; color: #8b949e; margin-bottom: 3px; }
  #energyEmojis { font-size: 13px; }
  #comboValue {
    font-size: 16px; font-weight: 800; color: #8b949e; margin-top: 4px;
    transition: color 0.2s;
  }
  #comboValue.hot { color: #ffd700; }

  /* 中部 */
  .center-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    padding: 10px 16px;
  }

  #centerPanel {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 480px;
  }
  #centerPanel.shake { animation: shake 0.4s; }

  #questionBox {
    background: rgba(22,27,34,0.9);
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 24px 20px;
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 14px;
  }
  #questionHint {
    font-size: 12px; color: #8b949e; margin-bottom: 12px;
    transition: color 0.2s;
  }
  #questionChinese {
    font-size: 20px; color: #c9d1d9; font-weight: 600;
    text-align: center; margin-bottom: 6px;
  }

  #answerSlots {
    display: flex; flex-wrap: wrap; justify-content: center;
    min-height: 44px; padding: 8px; gap: 6px;
    width: 100%;
  }
  .slot {
    display: flex; align-items: center; justify-content: center;
    padding: 6px 14px; border-radius: 8px;
    background: rgba(88,166,255,0.15);
    border: 1px solid rgba(88,166,255,0.3);
    font-size: 14px; color: #58a6ff;
    font-weight: 500;
  }

  /* 选词区 */
  #wordPool {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px; width: 100%; max-width: 480px;
  }
  .word-btn {
    padding: 8px 16px; border-radius: 10px;
    border: 1px solid #30363d; background: rgba(22,27,34,0.85);
    color: #c9d1d9; font-size: 14px; cursor: pointer;
    transition: all 0.18s; user-select: none;
  }
  .word-btn:hover { border-color: #388bfd; background: rgba(56,139,253,0.1); transform: translateY(-2px); }
  .word-btn:active { transform: translateY(0); }
  .word-btn.selected { background: rgba(56,139,253,0.25); border-color: #388bfd; color: #58a6ff; }
  .word-btn.wrong-flash { background: rgba(248,81,73,0.25) !important; border-color: #f85149 !important; color: #f85149 !important; }
  .word-btn.fogged { opacity: 0.6; cursor: pointer; }
  .word-btn.fog-cleared { opacity: 1; }

  /* 操作按钮 */
  .action-btns {
    display: flex; gap: 10px; justify-content: center;
    margin-top: 16px; width: 100%; max-width: 480px;
    flex-shrink: 0;
  }
  .action-btn {
    flex: 1; padding: 10px; border-radius: 12px;
    border: 1px solid #30363d; background: rgba(22,27,34,0.85);
    color: #8b949e; font-size: 13px; cursor: pointer;
    transition: all 0.2s; text-align: center;
  }
  .action-btn:hover { border-color: #388bfd; color: #58a6ff; }
  .action-btn.go-btn {
    background: rgba(63,185,80,0.15); border-color: rgba(63,185,80,0.4); color: #3fb950;
    font-weight: 600;
  }
  .action-btn.go-btn:hover { background: rgba(63,185,80,0.25); border-color: #3fb950; }

  /* Fever 输入 */
  #feverInput {
    width: 100%; max-width: 400px; padding: 12px 18px;
    border-radius: 12px; border: 1.5px solid #ffd700;
    background: rgba(22,27,34,0.9);
    color: #ffd700; font-size: 16px; text-align: center; outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
    margin-top: 10px;
  }
  #feverInput::placeholder { color: rgba(255,215,0,0.4); }
  #feverProgress { font-size: 12px; color: #ffd700; margin-top: 6px; min-height: 18px; }

  /* 底部状态栏 */
  .bottom-stats {
    display: flex; gap: 20px; justify-content: center;
    padding: 8px 20px 12px;
    background: rgba(10,14,23,0.85);
    border-top: 1px solid rgba(48,54,61,0.5);
    flex-shrink: 0;
  }
  .stat-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stat-label { font-size: 10px; color: #484f58; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 16px; font-weight: 700; color: #c9d1d9; }

  /* ── 动画 ── */
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 正确提示 */
  .correct-overlay {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .correct-text {
    font-size: 28px; font-weight: 800; color: #3fb950;
    text-shadow: 0 0 20px rgba(63,185,80,0.6);
    animation: fadeUp 0.2s forwards;
  }
  .correct-text.combo-3 { font-size: 36px; color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.7); }
  .correct-text.combo-4, .correct-text.combo-5 { font-size: 44px; color: #ff0080; text-shadow: 0 0 40px rgba(255,0,128,0.7); }

  /* Fever 正确 */
  .fever-correct-overlay {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .fever-correct-text {
    font-size: 40px; font-weight: 900; color: #ffd700;
    text-shadow: 0 0 40px rgba(255,215,0,0.8);
    animation: fadeUp 0.2s forwards;
  }

  /* 粒子 */
  .particle {
    position: fixed; width: 8px; height: 8px; border-radius: 50%;
    pointer-events: none; z-index: 90;
    animation: particleFly 0.9s ease-out forwards;
  }
  @keyframes particleFly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
  }

  .fever-particle {
    position: fixed; width: 14px; height: 14px; border-radius: 50%;
    pointer-events: none; z-index: 90;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    animation: feverParticleFly 0.7s ease-out forwards;
  }
  @keyframes feverParticleFly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
  }

  .firework {
    position: fixed; width: 6px; height: 6px; border-radius: 50%;
    pointer-events: none; z-index: 95;
  }

  .flash-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 80;
    animation: flashFade 0.5s ease-out forwards;
  }
  @keyframes flashFade {
    0%   { opacity: 0.35; }
    100% { opacity: 0; }
  }
  .fever-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 80;
    animation: flashFade 0.25s ease-out forwards;
  }

  .bg-particle {
    position: fixed; width: 2px; height: 2px;
    background: rgba(255,255,255,0.3); border-radius: 50%;
    pointer-events: none; z-index: 0;
    animation: bgFloat 8s ease-in-out infinite;
  }
  @keyframes bgFloat {
    0%,100% { transform: translateY(0); opacity: 0.3; }
    50%      { transform: translateY(-20px); opacity: 0.1; }
  }

  /* Fever Mode */
  body.fever { background: #1a0a10 !important; }
  body.fever #energyBar { background: linear-gradient(to top, #ff6b35, #ffd700, #ff0080) !important; }
  body.fever #questionBox { border-color: #ffd700 !important; background: rgba(40,20,10,0.95) !important; }
  .fever-timer {
    position: absolute; top: 8px; right: 12px;
    font-size: 20px; font-weight: 900; color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.8);
    transition: color 0.2s;
  }
  .fever-timer.urgent { color: #f85149; text-shadow: 0 0 15px rgba(248,81,73,0.8); animation: pulse 0.4s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  .fever-shake { animation: shake 0.3s !important; }

  /* 迷雾弹窗 */
  .fog-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 300;
    backdrop-filter: blur(4px);
  }
  .fog-modal {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 18px; padding: 28px 24px;
    max-width: 380px; width: 90%;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    animation: slideDown 0.3s;
  }
  .fog-modal h3 { font-size: 18px; color: #c9d1d9; }
  .fog-word-display {
    font-size: 32px; font-weight: 800; letter-spacing: 3px;
    color: #58a6ff; padding: 12px 24px;
    background: rgba(88,166,255,0.08);
    border: 1px solid rgba(88,166,255,0.2);
    border-radius: 12px;
  }
  .fog-input {
    width: 100%; padding: 12px 16px; border-radius: 10px;
    border: 1.5px solid #30363d; background: rgba(22,27,34,0.9);
    color: #e0e0e0; font-size: 15px; text-align: center; outline: none;
    transition: border-color 0.2s;
  }
  .fog-input:focus { border-color: #58a6ff; }
  .fog-result { font-size: 14px; min-height: 20px; }
  .fog-result.success { color: #3fb950; }
  .fog-result.fail { color: #f85149; }
  .fog-btns { display: flex; gap: 10px; width: 100%; }
  .fog-btn {
    flex: 1; padding: 10px; border-radius: 10px; cursor: pointer;
    font-size: 13px; transition: all 0.2s;
  }
  .fog-btn-confirm {
    background: rgba(56,139,253,0.2); border: 1px solid #388bfd;
    color: #58a6ff;
  }
  .fog-btn-confirm:hover { background: rgba(56,139,253,0.3); }
  .fog-btn-cancel {
    background: transparent; border: 1px solid #30363d; color: #8b949e;
  }
  .fog-btn-cancel:hover { border-color: #f85149; color: #f85149; }

  /* 语义连线弹窗 */
  .synthesis-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px; overflow-y: auto;
    backdrop-filter: blur(6px);
  }
  .synthesis-modal {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 18px; padding: 24px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 16px 64px rgba(0,0,0,0.7);
    animation: slideDown 0.3s;
  }
  .synthesis-modal::-webkit-scrollbar { width: 5px; }
  .synthesis-modal::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  .synthesis-badge {
    font-size: 11px; color: #ffd700; letter-spacing: 1.5px;
    text-transform: uppercase; text-align: center; margin-bottom: 8px;
  }
  .synthesis-title {
    font-size: 14px; color: #8b949e; text-align: center; margin-bottom: 20px;
  }
  .syn-cards-container { display: flex; flex-direction: column; gap: 14px; }
  .syn-card {
    background: rgba(22,27,34,0.8); border: 1px solid #30363d;
    border-radius: 14px; padding: 16px;
    transition: border-color 0.2s;
  }
  .syn-card-shake { animation: shake 0.4s; }
  .syn-card-phrase {
    font-size: 15px; color: #c9d1d9; font-weight: 600; margin-bottom: 10px;
  }
  .syn-sentence-box, .syn-upgraded-box {
    padding: 10px 12px; border-radius: 8px; margin-bottom: 8px;
    font-size: 14px; line-height: 1.5;
  }
  .syn-sentence-box { background: rgba(48,54,61,0.4); }
  .syn-upgraded-box { background: rgba(63,185,80,0.12); border: 1px solid rgba(63,185,80,0.3); }
  .syn-label {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 1px; margin-right: 6px;
  }
  .syn-label-orig { background: rgba(72,79,88,0.4); color: #8b949e; }
  .syn-label-good { background: rgba(63,185,80,0.2); color: #3fb950; }
  .syn-blank { color: #58a6ff; font-weight: 700; }
  .syn-phrase-used { color: #3fb950; font-weight: 600; }
  .syn-options-row {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px; margin-top: 8px;
  }
  .syn-option-hint { font-size: 11px; color: #8b949e; width: 100%; margin-bottom: 2px; }
  .syn-option-btn {
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid #30363d; background: transparent;
    color: #c9d1d9; font-size: 12px; cursor: pointer;
    transition: all 0.15s;
  }
  .syn-option-btn:hover { border-color: #388bfd; color: #58a6ff; background: rgba(56,139,253,0.08); }
  .syn-option-btn.syn-opt-correct {
    background: rgba(63,185,80,0.2) !important; border-color: #3fb950 !important; color: #3fb950 !important;
  }
  .syn-option-btn.syn-opt-wrong {
    background: rgba(248,81,73,0.15) !important; border-color: #f85149 !important; color: #f85149 !important;
  }
  .syn-feedback { font-size: 12px; margin-top: 6px; min-height: 18px; }
  .syn-feedback-wrong { color: #f85149; }
  .syn-progress { font-size: 12px; color: #8b949e; margin-top: 12px; text-align: center; }
  .syn-result-msg {
    font-size: 14px; text-align: center; margin-top: 8px; min-height: 22px;
  }
  .syn-result-msg.success { color: #3fb950; font-weight: 600; }
  .synthesis-skip-btn {
    display: block; width: 100%; padding: 10px; margin-top: 14px;
    border-radius: 10px; border: 1px solid #30363d;
    background: transparent; color: #8b949e; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .synthesis-skip-btn:hover { border-color: #388bfd; color: #58a6ff; }

  /* 完成画面 */
  .finish-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 400; backdrop-filter: blur(8px);
    padding: 24px;
    animation: fadeIn 0.4s;
  }
  .finish-overlay h2 {
    font-size: 32px; color: #ffd700;
    text-shadow: 0 0 30px rgba(255,215,0,0.5);
    margin-bottom: 20px;
  }
  .finish-overlay p { font-size: 15px; color: #8b949e; margin: 6px 0; }
  .finish-btns {
    display: flex; gap: 12px; margin-top: 24px; width: 100%; max-width: 320px;
  }
  .btn-back-to-cat, .btn-restart {
    flex: 1; padding: 12px; border-radius: 12px;
    font-size: 14px; cursor: pointer; transition: all 0.2s;
    text-align: center; border: 1px solid;
  }
  .btn-back-to-cat {
    background: transparent; border-color: #30363d; color: #8b949e;
  }
  .btn-back-to-cat:hover { border-color: #388bfd; color: #58a6ff; }
  .btn-restart {
    background: rgba(63,185,80,0.15); border-color: rgba(63,185,80,0.4); color: #3fb950;
  }
  .btn-restart:hover { background: rgba(63,185,80,0.25); border-color: #3fb950; }

  @media (max-width: 480px) {
    #questionChinese { font-size: 18px; }
    .word-btn { padding: 6px 12px; font-size: 13px; }
    .study-learn-zh { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- ══ 分类页 ══ -->
<div id="categoryPage">
  <div class="page-header">
    <h1>✏️ 写作词伙选词练习</h1>
    <p>IELTS 写作词伙 · 分类突破</p>
  </div>

  <div class="section-label">📊 小作文词伙</div>
  <div id="gridXiaoZuoWen" class="cat-grid"></div>

  <div class="section-label">📝 大作文词伙</div>
  <div id="gridDaZuoWen" class="cat-grid"></div>
</div>

<!-- ══ 课前学习页 ══ -->
<div id="studyOverlay" style="display:none;">
  <div class="study-header">
    <h2 id="studyTitle">📖 课前学习</h2>
    <p id="studySubtitle">学习每个词伙的正确拼写</p>
    <button class="btn-back-cat" onclick="backToCategory()" title="返回分类" style="margin-top:10px;">← 返回分类</button>
  </div>
  <div id="studyProgress">1 / 20</div>
  <div id="studyGrid"></div>

  <div id="studyCard">
    <div class="study-learn-round" id="studyRoundLabel">第 1 遍（共需2遍）</div>
    <div class="study-learn-zh" id="studyLearnZh">中文</div>
    <div class="study-learn-ref" id="studyLearnEnRef">english phrase</div>
    <input class="study-learn-input" id="studyInput" type="text"
           autocomplete="off" spellcheck="false" placeholder="输入英文词伙...">
    <div class="study-hint" id="studyHint"></div>
    <div id="studyFeedback"></div>
    <div class="study-btns">
      <button class="study-btn" id="studySkipBtn">跳过此词伙 ›</button>
      <button class="study-btn study-btn-primary" id="studyFinishBtn" style="display:none">开始练习 ✓</button>
    </div>
  </div>
</div>

<!-- ══ 游戏主体 ══ -->
<div id="gameContent" style="display:none;">
  <!-- 顶部 -->
  <div class="top-bar">
    <div class="top-left">
      <span id="headerCatBadge">分类</span>
      <span id="questionNum">01 / 20</span>
      <span id="progress">0/0</span>
    </div>
    <div class="energy-wrap">
      <span id="energyValue">0</span>
      <div id="energyBar"></div>
      <span id="energyEmojis">😶</span>
    </div>
    <div class="top-right">
      <span id="comboValue">x0</span>
    </div>
  </div>

  <!-- 中部 -->
  <div class="center-area">
    <div id="centerPanel">
      <div id="questionBox">
        <div id="questionHint">👆 点击英文单词组成答案 →</div>
        <div id="questionChinese">中文</div>
      </div>
      <div id="answerSlots"><span style="color:#484f58;font-size:15px">点击上方单词组成答案 →</span></div>
      <div id="wordPool"></div>
      <input id="feverInput" type="text" autocomplete="off" spellcheck="false"
             style="display:none" placeholder="直接输入答案...">
      <div id="feverProgress"></div>
    </div>

    <div class="action-btns">
      <button class="action-btn" onclick="clearSelection()">清空</button>
      <button class="action-btn go-btn" onclick="checkAnswer()">确认 ✓</button>
    </div>
  </div>

  <!-- 底部 -->
  <div class="bottom-stats">
    <div class="stat-item"><span class="stat-label">正确</span><span class="stat-value" id="correctCount">0</span></div>
    <div class="stat-item"><span class="stat-label">正确率</span><span class="stat-value" id="accuracy">0%</span></div>
    <div class="stat-item"><span class="stat-label">最大连击</span><span class="stat-value" id="maxCombo">x0</span></div>
  </div>
</div>

<script src="categories.js"></script>
<script src="game.js"></script>
</body>
</html>
