<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作词伙选词练习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #0a0e17;
    color: #e0e0e0;
    min-height: 100vh;
    overflow: hidden;
    transition: background 1s;
  }

  .btn-back-cat {
    padding: 5px 14px;
    border-radius: 8px;
    border: 1px solid #30363d;
    background: transparent;
    color: #8b949e;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn-back-cat:hover { border-color: #58a6ff; color: #58a6ff; }

  #studyOverlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: #0a0e17;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    z-index: 500; padding: 30px 20px; box-sizing: border-box; overflow-y: auto;
  }
  .study-header { text-align: center; margin-bottom: 16px; padding-top: 10px; }
  .study-header h2 { color: #58a6ff; font-size: 22px; margin-bottom: 6px; }
  .study-header p { color: #8b949e; font-size: 13px; }
</style>
</head>
<body>
<div id="studyOverlay" style="display:none;">
  <div class="study-header">
    <h2 id="studyTitle">📖 课前学习</h2>
    <p id="studySubtitle">学习每个词伙的正确拼写</p>
    <button class="btn-back-cat" onclick="backToCategory()" title="返回分类" style="margin-top:10px;">← 返回分类</button>
  </div>
</div>
</body>
</html>
